name: bounded research checks
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pari-gp
      - run: python -m pip install -r requirements-research.txt
      - run: python -m unittest discover -s scripts -p 'test*.py' -v
